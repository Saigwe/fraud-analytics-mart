# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1414
tables:
  - name: accounts
    rows: 500
    pk: account_id
    cast: {opened_date: date}
    columns:
      account_id: {type: id, prefix: A}
      opened_date: {type: date, start: 2018-01-01, end: 2024-12-31}
      country_code: {type: choice, values: [GB, PT, IE, NG], p: [0.5, 0.2, 0.2, 0.1]}
  - name: transactions
    rows: 20000
    pk: tx_id
    fk: {account_id: accounts.account_id}
    columns:
      tx_id: {type: id, prefix: TX, width: 8}
      account_id: {type: fk, table: accounts, column: account_id}
      tx_ts: {type: timestamp, start: 2025-01-01, end: 2025-03-31}
      amount_usd: {type: float, dist: lognormal, mean: 3.5, sigma: 1.2}
      merchant_category: {type: choice, values: [grocery, travel, electronics, restaurants, gambling, utilities]}
      channel: {type: choice, values: [card_present, online], p: [0.6, 0.4]}
      is_fraud: {type: bool, p: 0.003}
    duplicate: {rows: 15, id_column: tx_id, shift_column: tx_ts, shift_minutes: 2}
