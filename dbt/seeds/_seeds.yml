version: 2

seeds:
  - name: control_catalogue
    description: The audit controls, their severity and owner.
    columns:
      - name: control_id
        data_tests: [unique, not_null]
  - name: exception_reviews
    description: Analyst decisions on exceptions. Empty in the repo; a case-management tool would write here.
    config:
      column_types: {exception_id: varchar, status: varchar, reviewed_by: varchar, reviewed_at: timestamp}
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [open, confirmed_fraud, false_positive, escalated]
