version: 2
models:
  - name: rpt_duplicate_payments
    columns:
      - name: tx_id
        data_tests: [unique, not_null]
  - name: rpt_benford_first_digit
    columns:
      - name: digit
        data_tests:
          - unique
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
