version: 2

models:
  - name: stg_paysim__transactions
    columns:
      - name: tx_id
        data_tests: [unique, not_null]
      - name: tx_type
        data_tests:
          - accepted_values:
              arguments:
                values: [CASH_IN, CASH_OUT, DEBIT, PAYMENT, TRANSFER]
      - name: amount
        data_tests: [not_null]
      - name: orig_account
        data_tests: [not_null]
      - name: dest_account
        data_tests: [not_null]
